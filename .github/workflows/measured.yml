name: Summarize actual wait submissions
on:
  schedule:
    - cron: '40 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: measured-summary
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python measured_daily.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
