name: Diagnose official source connectivity
on:
  workflow_dispatch:
  push:
    branches: [fix/weekly-alcohol-update]
    paths: ['.github/workflows/official-diagnostics.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify current source policy and a small menu sample
        run: python diagnose_official.py --transport-check
