name: Collect park observations
on:
  push:
    branches: [main]
    paths: ['collector.py', 'reliability.py', 'continuous_evaluation.py', 'collection_session.py', '.github/workflows/collect.yml']
  schedule:
    # UTC: 08:07-21:52 JST, 15-minute cadence with off-hour-start offsets.
    - cron: '7,22,37,52 23,0-12 * * *'
  workflow_dispatch:
    inputs:
      admin_event:
        description: 'Optional validated DPA outbox JSON exported by an administrator'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: crowd-data-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore durable data checkout
        shell: bash
        run: |
          git fetch origin crowd-data || true
          if git show-ref --verify --quiet refs/remotes/origin/crowd-data; then
            git worktree add .data origin/crowd-data
          else
            mkdir .data
            git -C .data init
            git -C .data switch --orphan crowd-data
            git -C .data remote add origin "$(git remote get-url origin)"
            git -C .data config http.https://github.com/.extraheader "$(git config http.https://github.com/.extraheader)"
          fi
      - name: Verify or recover durable databases
        run: python backup_recovery.py .data --only disneyland.db --only disneysea.db
      - name: Collect and evaluate
        id: collect
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          COLLECTOR_EVENT: ${{ github.event_name }}
          ADMIN_EVENT_JSON: ${{ inputs.admin_event }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python collection_session.py --data-dir .data --context --minutes 330 --push
          else
            python collection_session.py --data-dir .data --context --force --push
          fi
      - name: Audit schedule coverage and storage
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python audit_runtime.py --data-dir .data
      - name: Persist observations and failure log
        if: always()
        shell: bash
        run: python -c "from collection_session import persist; persist('.data')"
      - name: Retain failed persistence artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collection-recovery-${{ github.run_id }}
          path: |
            .data/*.db
            .data/collection-attempts.jsonl
            .data/journal/
          retention-days: 7
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
