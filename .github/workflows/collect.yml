name: Collect park observations
on:
  push:
    branches: [main]
    paths: ['collector.py', 'reliability.py', '.github/workflows/collect.yml']
  schedule:
    # UTC: 08:07-21:52 JST, 15-minute cadence with off-hour-start offsets.
    - cron: '7,22,37,52 23,0-12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crowd-data-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore durable data checkout
        shell: bash
        run: |
          git fetch origin crowd-data || true
          if git show-ref --verify --quiet refs/remotes/origin/crowd-data; then
            git worktree add .data origin/crowd-data
          else
            mkdir .data
            git -C .data init
            git -C .data switch --orphan crowd-data
            git -C .data remote add origin "$(git remote get-url origin)"
            git -C .data config http.https://github.com/.extraheader "$(git config http.https://github.com/.extraheader)"
          fi
      - name: Collect and evaluate
        id: collect
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python collector.py --data-dir .data --context
          else
            python collector.py --data-dir .data --context --force
          fi
      - name: Persist observations and failure log
        if: always()
        shell: bash
        run: |
          git -C .data config user.name 'github-actions[bot]'
          git -C .data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .data add -- '*.db' 'last-run.json'
          if ! git -C .data diff --cached --quiet; then
            git -C .data commit -m 'Record park observations and forecast evaluations'
            git -C .data push origin HEAD:crowd-data
          fi
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
